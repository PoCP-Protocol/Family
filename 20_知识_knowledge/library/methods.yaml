# 方法卡｜可执行到家庭日常粒度的动作 —— 回答"今晚这个家庭具体做什么"
# id 前缀必须为 MD-。
# grounded_in 指向 TH- 卡(必填,否则 error);targets_constructs 指向 CN- 卡(必填,否则 error)。
# derived_from 指向 PG- 卡,说明这个动作是从哪套已验证项目里拆出来的。
# dose 缺失 = warn(无法执行也无法复核);contraindication 缺失 = warn。
# risk_level 缺失 = warn;risk_level 为 中/高(medium/high)却无 human_requirement = error。
#
# risk_level / human_requirement 已按 ..\..\10_规格_spec\ISSUES.md B1 裁决补入,
# 与 spec 02 §3.5 Intervention 同名同义 —— 高风险家庭场景必须 Human Gate。

methods: []

