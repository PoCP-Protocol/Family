# 课程阶梯 / 成长路径体系(忠实取自 S2p7 漏斗 + S1p9 用户路径 + S2p17 脊柱 + S1p8 价格阶梯)
# 这是"课程体系"的系统视图:一个家庭沿哪条路径逐鳞前进,每鳞用哪门课件承载。红线:每一鳞都不承诺结果,结果在购买之后靠真实行为改变证明。
course_ladder:
  funnel: [触发, 觉醒, 行动, 改变, 长期, 传播]   # S2p7
  rungs:
    - {step: 1, funnel: 觉醒, rung: 测评看清优先级, course: null,          entity: 家庭/父母成长测评, price: 免费,      gate: "测评≠诊断≠GrowthState;只做优先级排序"}
    - {step: 2, funnel: 行动, rung: 入口体验小改变, course: PARENT_5D_V1,   entity: 5天好爸妈入门营,   price: "99", price_status: unverified_promotional, gate: "完课≠改变;只求第一次接住情绪。价格¥99仅营销口径,web核验未坐实"}
    - {step: 3, funnel: 行动, rung: 按痛点选专项营, course_pool: [PARENT_21D_V1, SCREEN_21D_V1, STUDY_21D_V1, SELFDRIVE_21D_V1], entity: 21天专项训练营(4大痛点), price: "99–399", gate: "打卡≠Outcome;由测评优先级路由,不多买"}
    - {step: "3.5", funnel: 改变, rung: 核心旗舰深入, course: WISDOM_21D_V1, entity: 21天智慧父母训练营, price: "4980", price_status: unverified_promotional, gate: "系统深入;修复关系→回应消极→顺畅沟通;完课≠改变;命名来源 E2/E3,价格¥4980与三模块拆解 web核验未坐实"}
    - {step: 4, funnel: 改变, rung: 系统性家庭改善, course: FAMILY_90D_V1,  entity: 90天家庭成长计划,  price: "1999–9999", gate: "四阶段 SEE→PARENT_FIRST→CO_CREATE→STABILIZE;完课≠改变"}
    - {step: 5, funnel: 长期, rung: 持续陪伴留存,   course: null,          entity: 年度家庭成长会员,  price: "999–2999/年", gate: "会员≠家庭状态;FELS-3,非课件", courseware_status: NA}
    - {step: 6, funnel: 传播, rung: 成果传播裂变,   course: null,          entity: 成长报告+邀请,     price: 成长权益,   gate: "传播结果不传播焦虑;非课件", courseware_status: NA}
  routing_rule: "测评优先级 → 对应 21天专项营;入门营(5天)为所有路径的可选前置;不做全家打包多买"
  pathway_note: "5天=筛意愿建信任 · 21天=单点行为改变 · 90天=系统性改善+案例;每鳞独立可交付,亦可顺序推进"

