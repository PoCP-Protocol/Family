# 21天家长训练营 · 手机不靠没收,靠一起定规则(FELS 课程内容层)
# 挂载:legacy_training_camps(camp_code=SCREEN_21D_V1)/ legacy_daily_tasks.content_ref
# 主线:先连接不先控制 · 家长先示范 · 协商共管 → 逐步自主(非戒断/没收)
# 证据:屏幕专项为纵向/评估级(E4,外推 MODERATE),机制主要引已核验的家长管理/自主支持(E6–E7)。全部 crossref 实核。
# 红线:父母先改变 · 不贴标签(不诊断"手机成瘾")· 不制造焦虑 · 打卡≠结果 · 完课≠改变 · 观察≠事实 · 不承诺"戒手机" · 疑似成瘾/自伤/网络危险→转专业。
meta:
  camp_code: SCREEN_21D_V1
  title: 21天家长训练营 · 手机不靠没收,靠一起定规则
  duration_days: 21
  audience: 家长(父母先改变;孩子不是被改造对象)
  philosophy: 先连接不先控制;家长先示范自己的手机习惯;把"没收"换成"一起定规则、逐步交还自主"
  phases:
    - {code: SEE_CONNECT,  title: 看见与连接, day_from: 1,  day_to: 7}
    - {code: PARENT_FIRST, title: 家长先改变, day_from: 8,  day_to: 14}
    - {code: CO_STABILIZE, title: 共创与稳定, day_from: 15, day_to: 21}
  evidence_grounding:            # 全部 crossref 实核(2026-08-15)
    - {id: SCREEN_MONITOR, doi: "10.1016/j.cdnut.2024.103264",         grade: E4, verified: true, external_validity: MODERATE, note: "家长屏幕监控·纵向关联(2024;非RCT,方向性证据)"}
    - {id: SCREEN_SMART,   doi: "10.4172/2375-4494.1000124",          grade: E4, verified: true, external_validity: MODERATE, note: "Screen Smart 家庭聚焦干预评估(2014;小样本/低层期刊)"}
    - {id: TRIPLE_P_META,  doi: "10.1016/j.cpr.2014.04.003",          grade: E7, verified: true, external_validity: MODERATE, note: "Triple P meta(自主支持/有限选择机制)"}
    - {id: IY_RCT,         doi: "10.5093/pi2022a2",                   grade: E7, verified: true, external_validity: MODERATE, note: "Incredible Years RCT(边界/一致性机制)"}
    - {id: COERCIVE,       doi: "10.1017/S0954579414000169",         grade: E6, verified: true, external_validity: LIMITED,  note: "强制家庭过程(打断'催→对抗';早童样本)"}
    - {id: PARENT_TEEN_COMM, doi: "10.1016/j.jadohealth.2017.11.067", grade: E6, verified: true, external_validity: 直接相关, note: "亲子沟通家长干预"}
    - {id: EMO_COACH_RCT,  doi: "10.1016/j.adolescence.2015.04.005",  grade: E7, verified: true, external_validity: 直接相关, note: "情绪教练 RCT"}
    - {id: EMO_REG_META,   doi: "10.32920/26052868",                 grade: E7, verified: true, external_validity: MODERATE, note: "情绪调节·家长 meta(具体肯定机制)"}
