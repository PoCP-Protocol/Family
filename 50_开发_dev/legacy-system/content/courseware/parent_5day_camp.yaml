# 5天好爸妈入门训练营(FELS 课程内容层 · 入口体验鳞)
# 挂载:legacy_training_camps(camp_code=PARENT_5D_V1)/ legacy_daily_tasks.content_ref
# 定位:课程阶梯的入口体验鳞(测评→【5天入门】→21天×痛点→90天→会员);低价获客、筛意愿、第一次小改变
# 命名来源:课程名「5天好爸妈训练营」、工具名「情绪五维法/移情图」取自 S3 网络检索补充(E2/E3,推广口径)——
#   仅取"结构与命名",内容一律用已 crossref 实核的循证方法填充;品牌工具的官方逐日教案原文缺失,标 【官方教案待补】,不臆造其内部步骤。
# 红线:父母先改变 · 不承诺提分/疗效 · 不比较排名 · 不贴标签 · 打卡≠结果 · 完课≠改变 · 观察≠事实 · 危机转人工。
