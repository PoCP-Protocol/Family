days:
  - {day: 1, phase: SEE_CONNECT, content_ref: "PARENT_5D_V1#D1", theme: 先看见自己的情绪反应, skill: 家长情绪自我觉察, why: 教育里第一个失控的常是家长的情绪;先看见自己,才谈得上接住孩子。, evidence_refs: [EMO_COACH_RCT], parent_action: 记录今天你情绪一上来的 1 个时刻和当时的话。, say_it_tonight: “刚才我有点急,我先冷静一下。”, look_for: 你自己的情绪触发点,不是给孩子记账。, boundary: 先看见,不评判。}
  - {day: 2, phase: SEE_CONNECT, content_ref: "PARENT_5D_V1#D2", theme: 先接住情绪·给情绪命名, skill: 情绪确认与命名(情绪五维法·入门), why: 情绪先被看见和命名,人才平静下来,道理才听得进。, evidence_refs: [EMO_COACH_RCT, EMO_REG_META], parent_action: 孩子有情绪时,先替他把情绪说出来一次(如“你现在很委屈”)。, say_it_tonight: “你现在是不是有点生气/难过？我懂。”, look_for: 情绪被命名后是否平缓一点。, boundary: “情绪五维法”官方逐日教案 【官方教案待补】;今天先练"命名情绪"这一步,不套未经证实的固定话术。}
  - {day: 3, phase: PARENT_FIRST, content_ref: "PARENT_5D_V1#D3", theme: 站到孩子角度看一次, skill: 移情/换位(移情图·入门), why: 先理解他的处境,回应才不会错位。, evidence_refs: [ROGERS], parent_action: 就今天一件冲突,试着说出孩子那一边的感受和需要。, say_it_tonight: “换成是我在你这个位置,可能也会这样。”, look_for: 你能否说出他的感受与需要(而非只讲道理)。, boundary: “移情图”官方模板 【官方教案待补】;今天只练"说出对方感受"这一动作。}
  - {day: 4, phase: PARENT_FIRST, content_ref: "PARENT_5D_V1#D4", theme: 先连接再说话, skill: 主动倾听(先听后说), why: 先听懂再开口,比一上来讲道理更能被接受。, evidence_refs: [PARENT_TEEN_COMM, ROGERS], parent_action: 今天谈事前,先完整听孩子说完不打断。, say_it_tonight: “你先说,我听完再说我的想法。”, look_for: 先听完后对话是否更少对抗。, boundary: 倾听不是审问,不追着问“为什么”。}
  - {day: 5, phase: CO_STABILIZE, content_ref: "PARENT_5D_V1#D5", theme: 定一件继续做的小改变, skill: 选择与承诺, why: 5天的意义不在学多,而在选一件真能继续的小事。, evidence_refs: [EMO_REG_META], parent_action: 从这5天里选一个你要继续做的做法,写下来。, say_it_tonight: “这几天我最想继续做的是……你觉得呢？”, look_for: 一个你确定延续的做法,不评分。, boundary: 入门营不承诺提分/疗效;它只是第一次小改变,深入靠 21天/90天。}
