# 21天智慧父母训练营(核心旗舰 · FELS 课程内容层)
# 挂载:legacy_training_camps(camp_code=WISDOM_21D_V1)/ legacy_daily_tasks.content_ref
# 定位:课程阶梯的核心旗舰鳞(¥4980 档,系统深入);三模块=修复破裂亲子关系 / 面对孩子消极思维家长怎么回应 / 建立顺畅沟通
# 命名来源:课程名「21天智慧父母训练营」与三模块主题取自 S3 §9 网络检索补充(E2/E3,推广口径)——仅取"结构与命名";
#   内容一律用已 crossref 实核循证方法承载;波波校长官方逐日教案原文缺失,标 【官方教案待补】,不臆造其内部步骤。
# 关键安全改写:源模块「修正孩子消极思维」按红线改写为"家长如何回应孩子的消极思维"(父母先改变;不承诺改变孩子的想法/不灌鸡汤/不否定情绪)。
# 红线:父母先改变 · 不承诺提分或疗效 · 不比较排名 · 不贴标签 · 不诊断 · 打卡≠结果 · 完课≠改变 · 观察≠事实 · 危机转人工。
