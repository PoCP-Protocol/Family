    status: TECHNICAL_PASS_GOVERNANCE_NOT_CLOSED
    architecture_authorized: true
    code_authorized: true             # 代码保留
    runtime_authorized: true          # 仅内部受控 livecheck 手动开
    live_external_call_authorized: false   # 生产/试点默认外呼未授权
    pilot_authorized: false
    production_authorized: false
