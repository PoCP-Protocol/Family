# FPAI / Family Authorization Registry — machine-readable authorization SSOT
# M3-INT-001. 本文件是「授权来源」;Gate Report 只是「证据」,不得自我宣称授权。
# 原则:任何 runtime capability 若在此登记为未授权,危险授权扫描 = FAIL。
# 授权只能由总架构师(或其上级)通过 authorized_by + authorization_ref 落记;AI Agent 不得自增授权。
schema_version: AUTH_REGISTRY_V1
maintained_by: family-chief-architect
updated_at: "2026-08-11"

# M3-W1 收口(架构师 M3_W1_RUNTIME_INTEGRATION_FINAL_REVIEW = PASS,授权合并 PR #1)
program_gates:
  M3_INT_001: PASS_CLOSED            # FPAI Runtime Admission & Governance Reconciliation
  M3_W1_FAMILI_PRINCIPAL_RUNTIME: PASS_CLOSED
  FPAI_RUNTIME_ADMITTED_TO_MOS: YES  # merge commit 4398a857 → m3/family-1-0-mos;post-merge CI green
  # 代码已并入 ≠ 下述能力被授权;以下继续 NOT_AUTHORIZED:
  REAL_MODEL_DEFAULT_ENABLED: NO
  IMAGE_EXTERNAL_RUNTIME: NOT_AUTHORIZED
  PRODUCTION_PROVIDER_APPROVED: NO
  PUBLIC_FPAI_RUNTIME: NO
  PILOT_READY: NO
  NEXT_PROGRAM_STAGE: M3-W2_CONSUMER_PRODUCT_INTEGRATION

# 授权级别语义(布尔逐级递进,后者不因前者自动为真):
#   architecture_authorized     契约/架构已批
#   code_authorized             允许在仓库存在实现代码
#   runtime_authorized          允许在受控内部运行时执行
#   live_external_call_authorized 允许发起真实外部模型调用(对外数据发送)
#   pilot_authorized            允许对真实(试点)用户开启
#   production_authorized       允许生产环境默认开启
capabilities:
  - capability_id: M3_000_CONTRACT
    stage: M3-000
    status: PASS_CLOSED
    architecture_authorized: true
    code_authorized: true
    runtime_authorized: false
    live_external_call_authorized: false
    pilot_authorized: false
    production_authorized: false
    authorized_by: family-chief-architect
    authorization_ref: reports/m3/M3_000_GATE.md
    authorized_at: "2026-08-11"
    supersedes: []
    notes: 契约基线冻结;不承载 runtime。

  - capability_id: M3_101A_RUNTIME_FOUNDATION
    stage: M3-101A
    status: PASS_ACCEPTED_CLOSED
    architecture_authorized: true
    code_authorized: true
    runtime_authorized: true          # 受控内部 runtime(Fake/确定性)已正式验收
    live_external_call_authorized: false
    pilot_authorized: false
    production_authorized: false
    authorized_by: family-chief-architect
    authorization_ref: reports/m3/M3_RUNTIME_ARCHITECT_ADJUDICATION.md
    authorized_at: "2026-08-11"
