openapi: 3.1.0
info:
  title: Family Growth Platform API
  version: 0.2.0
  description: >
    Canonical API contract for Family Core and Growth Foundation.
    Core state mutations use Named Actions; generic PATCH is intentionally absent.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Family
  - name: Members
  - name: Relationships
  - name: LifeStage
  - name: Consent
  - name: Growth
  - name: Events
  - name: Outcomes

paths:
  /families:
    post:
      tags: [Family]
      operationId: CreateFamily
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFamilyRequest'}
      responses:
        '201':
          description: Family created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FamilyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}

  /families/{familyId}:
    get:
      tags: [Family]
      operationId: GetFamilyAggregate
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Family aggregate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FamilyAggregate'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /families/{familyId}/parents:
    post:
      tags: [Members]
      operationId: AddParent
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddParentRequest'}
      responses:
        '201':
          description: Parent added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /families/{familyId}/children:
    post:
      tags: [Members]
      operationId: AddChild
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddChildRequest'}
      responses:
        '201':
          description: Child added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PersonResponse'}

  /families/{familyId}/relationships:
    post:
      tags: [Relationships]
      operationId: CreateFamilyRelationship
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRelationshipRequest'}
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelationshipResponse'}

  /families/{familyId}/life-stages:
    post:
      tags: [LifeStage]
      operationId: AssignLifeStage
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignLifeStageRequest'}
      responses:
        '201':
          description: LifeStage assigned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LifeStageResponse'}

  /families/{familyId}/consents:
    post:
      tags: [Consent]
      operationId: GrantConsent
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantConsentRequest'}
      responses:
        '201':
          description: Consent granted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConsentResponse'}

  /families/{familyId}/growth-profiles:
    get:
      tags: [Growth]
      operationId: ListGrowthProfiles
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - in: query
          name: subjectType
          schema: {$ref: '#/components/schemas/GrowthDomain'}
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/GrowthProfileSummary'}

  /families/{familyId}/growth-priorities/confirm:
    post:
      tags: [Growth]
      operationId: ConfirmGrowthPriority
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmGrowthPriorityRequest'}
      responses:
        '201':
          description: Priority confirmed

  /families/{familyId}/events:
    post:
      tags: [Events]
      operationId: LogGrowthEvent
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogGrowthEventRequest'}
      responses:
        '201':
          description: Event logged

  /families/{familyId}/outcomes:
    post:
      tags: [Outcomes]
      operationId: MeasureOutcome
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MeasureOutcomeRequest'}
      responses:
        '201':
          description: Outcome created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FamilyId:
      in: path
      name: familyId
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    CorrelationId:
      in: header
      name: X-Correlation-Id
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Idempotency or state conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code: {type: string}
        message: {type: string}
        correlationId: {type: string}
        details: {type: object, additionalProperties: true}

    FamilyStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]

    GrowthDomain:
      type: string
      enum: [CHILD, PARENT, RELATIONSHIP]

    CreateFamilyRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
        primaryContactAccountId: {type: string}

    AddParentRequest:
      type: object
      additionalProperties: false
      required: [displayName, role]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
        role:
          type: string
          enum: [MOTHER, FATHER, GUARDIAN, OTHER_GUARDIAN]
        accountId: {type: string}

    AddChildRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 100}
        birthDate: {type: string, format: date}

    CreateRelationshipRequest:
      type: object
      additionalProperties: false
      required: [personAId, personBId, relationshipType]
      properties:
        personAId: {type: string, format: uuid}
        personBId: {type: string, format: uuid}
        relationshipType:
          type: string
          enum: [PARENT_CHILD, SPOUSE, SIBLING, GUARDIAN_CHILD, OTHER]

    AssignLifeStageRequest:
      type: object
      additionalProperties: false
      required: [childId, lifeStageCode, effectiveFrom]
      properties:
        childId: {type: string, format: uuid}
        lifeStageCode:
          type: string
          enum: [EARLY_ADOLESCENCE_12_15]
        effectiveFrom: {type: string, format: date-time}
        source: {type: string, default: MANUAL}

    GrantConsentRequest:
      type: object
      additionalProperties: false
      required: [subjectPersonId, guardianPersonId, purpose, policyVersion]
      properties:
        subjectPersonId: {type: string, format: uuid}
        guardianPersonId: {type: string, format: uuid}
        purpose:
          type: string
          enum:
            - SERVICE
            - ASSESSMENT
            - AI_PERSONALIZATION
            - GROWTH_TRACKING
            - EXPERT_SERVICE
            - RESEARCH
            - MODEL_IMPROVEMENT
            - CONTENT_PUBLICATION
        policyVersion: {type: string}

    ConfirmGrowthPriorityRequest:
      type: object
      additionalProperties: false
      required: [profileId, profileVersion, priorities]
      properties:
        profileId: {type: string, format: uuid}
        profileVersion: {type: integer, minimum: 1}
        priorities:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [dimensionId, rank]
            properties:
              dimensionId: {type: string}
              rank: {type: integer, minimum: 1, maximum: 2}

    LogGrowthEventRequest:
      type: object
      additionalProperties: false
      required: [eventType, occurredAt, source]
      properties:
        eventType: {type: string}
        occurredAt: {type: string, format: date-time}
        source: {type: string}
        actionId: {type: string, format: uuid}
        payload: {type: object, additionalProperties: true}

    MeasureOutcomeRequest:
      type: object
      additionalProperties: false
      required: [dimensionId, windowStart, windowEnd, source, confidence]
      properties:
        dimensionId: {type: string}
        baseline: {}
        current: {}
        windowStart: {type: string, format: date-time}
        windowEnd: {type: string, format: date-time}
        source: {type: string}
        evidenceIds:
          type: array
          items: {type: string, format: uuid}
        confidence: {type: number, minimum: 0, maximum: 1}
        context: {type: object, additionalProperties: true}
        possibleConfounders:
          type: array
          items: {type: string}

    FamilyResponse:
      type: object
      required: [familyId, displayName, status, version, createdAt]
      properties:
        familyId: {type: string, format: uuid}
        displayName: {type: string}
        status: {$ref: '#/components/schemas/FamilyStatus'}
        version: {type: integer}
        createdAt: {type: string, format: date-time}

    PersonResponse:
      type: object
      required: [personId, familyId, personType, displayName]
      properties:
        personId: {type: string, format: uuid}
        familyId: {type: string, format: uuid}
        personType: {type: string, enum: [PARENT, CHILD]}
        displayName: {type: string}

    RelationshipResponse:
      type: object
      required: [relationshipId, familyId, personAId, personBId, relationshipType]
      properties:
        relationshipId: {type: string, format: uuid}
        familyId: {type: string, format: uuid}
        personAId: {type: string, format: uuid}
        personBId: {type: string, format: uuid}
        relationshipType: {type: string}

    LifeStageResponse:
      type: object
      properties:
        assignmentId: {type: string, format: uuid}
        childId: {type: string, format: uuid}
        lifeStageCode: {type: string}
        effectiveFrom: {type: string, format: date-time}

    ConsentResponse:
      type: object
      properties:
        consentId: {type: string, format: uuid}
        purpose: {type: string}
        status: {type: string, enum: [GRANTED, WITHDRAWN, EXPIRED]}
        policyVersion: {type: string}

    GrowthProfileSummary:
      type: object
      properties:
        profileId: {type: string, format: uuid}
        subjectType: {$ref: '#/components/schemas/GrowthDomain'}
        subjectId: {type: string}
        version: {type: integer}
        confidence: {type: number}

    FamilyAggregate:
      type: object
      required: [family, members, relationships, lifeStages, consents]
      properties:
        family: {$ref: '#/components/schemas/FamilyResponse'}
        members:
          type: array
          items: {$ref: '#/components/schemas/PersonResponse'}
        relationships:
          type: array
          items: {$ref: '#/components/schemas/RelationshipResponse'}
        lifeStages:
          type: array
          items: {$ref: '#/components/schemas/LifeStageResponse'}
        consents:
          type: array
          items: {$ref: '#/components/schemas/ConsentResponse'}
